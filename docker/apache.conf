<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

<Directory /var/www/html/app>
    Require all denied
</Directory>

# The included HTTPS proxy sets this header. A forged value can only make
# this request's cookies stricter; application authentication is unchanged.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

ServerTokens Prod
ServerSignature Off
